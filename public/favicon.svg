<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Luxury Obsidian Background with Rounded Corner -->
  <rect width="100" height="100" rx="20" fill="#111111" />
  
  <!-- Stylized Modernist Pitched Roofline -->
  <path
    d="M18 42L50 14L82 42"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Radiant Ruby Keystone Diamond at Apex -->
  <polygon points="50,6 55,12 50,18 45,12" fill="#C8102E" />
  <circle cx="50" cy="12" r="1.5" fill="#FFFFFF" />

  <!-- Left Wing ('L' & Column of the House) -->
  <path
    d="M28 34V76H46"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Wing ('H' with Architectural Crossbeam) -->
  <path
    d="M54 34V76"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
  />
  <path
    d="M72 34V76"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
  />
  <!-- Connecting Crossbeam creating the 'H' -->
  <line
    x1="54"
    y1="54"
    x2="72"
    y2="54"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Central Luminous Sun / Warm Jewel -->
  <circle cx="50" cy="42" r="5" fill="#C8102E" />

  <!-- Foundation Plinth Line -->
  <line
    x1="20"
    y1="84"
    x2="80"
    y2="84"
    stroke="#FFFFFF"
    stroke-width="3.5"
    stroke-linecap="round"
  />
</svg>
